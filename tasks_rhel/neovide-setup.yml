- name: Install Required Packages
  become: true
  dnf:
    name:
      - "fontconfig-devel"
      - "freetype-devel"
      - "libstdc++-static"
      - "libstdc++-devel"
    state: present
  tags:
    - install
    - neovide
- name: Fetch and Build
  shell: |
    ~/.cargo/bin/cargo install --git https://github.com/neovide/neovide
  tags:
    - install
    - neovide
