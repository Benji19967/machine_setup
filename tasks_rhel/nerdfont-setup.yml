- name: Ensure font directory exists
  ansible.builtin.file:
    path: "~/.local/share/fonts/meslo-nerd"
    state: directory
    mode: '0755'
  tags:
    - install
    - nerdfont
- name: Download and unarchive Meslo Nerd Font
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Meslo.zip"
    dest: "~/.local/share/fonts/meslo-nerd"
    remote_src: true
    mode: '0644'
  tags:
    - install
    - nerdfont
- name: Rebuild system font cache
  ansible.builtin.command: fc-cache -fv
  changed_when: true
  tags:
    - install
    - nerdfont
